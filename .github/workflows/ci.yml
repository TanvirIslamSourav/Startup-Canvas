name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        working-directory: backend
        run: ruff check app

      - name: Compile sanity check
        working-directory: backend
        run: python -m compileall -q app

      - name: Import smoke test
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.sqlite
          JWT_SECRET: ci-secret-not-secure
          CORS_ORIGINS: '["http://localhost:5173"]'
          AI_PROVIDER: mock
        run: |
          python -c "import app.main as m; print('routes=', len(m.app.routes))"

      - name: Pytest
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.sqlite
          JWT_SECRET: ci-secret-not-secure
          CORS_ORIGINS: '["http://localhost:5173"]'
          AI_PROVIDER: mock
        run: pytest -q --maxfail=1

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  docker-config:
    name: Docker compose config
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: |
          set -e
          docker compose config --quiet
          echo "compose OK"
