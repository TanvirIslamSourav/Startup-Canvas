name: ✨ Feature Request
description: Propose a new feature, improvement, or module.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you'd like to see in Startup Canvas. Please include the
        problem it solves and a sketch of the proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What user problem does this solve? Why is it important?
      placeholder: I want to compare two competitor analyses side by side so I can show investors a single view.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: Add a `/compare` route that takes two competitor IDs and renders a diff table.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: We could add this as a CSV export instead of an in-app comparison view.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Estimated scope
      options:
        - Small (single component / one-off fix)
        - Medium (one module, a few files)
        - Large (cross-module / architectural)
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / references
      description: Screenshots, links, or ASCII sketches.
      render: markdown
    validations:
      required: false

  - type: textarea
    id: willingness
    attributes:
      label: Willingness to contribute
      placeholder: Happy to open a PR / can help with docs / just an idea.
    validations:
      required: false