# ==========================================================
# Startup Canvas — Docker Compose
# Local development stack: PostgreSQL + FastAPI + Vite-nginx
# ==========================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: startup-canvas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-startup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-startup}
      POSTGRES_DB: ${POSTGRES_DB:-startup_canvas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-startup} -d ${POSTGRES_DB:-startup_canvas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: startup-canvas-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-startup}:${POSTGRES_PASSWORD:-startup}@postgres:5432/${POSTGRES_DB:-startup_canvas}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: startup-canvas-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    environment:
      VITE_API_BASE_URL: http://backend:8000/api/v1

volumes:
  postgres-data:
    name: startup-canvas-postgres-data
